name: "💡 Sugestão"
description: "Uma ideia solta, provocação ou caminho para explorar."
title: "[💡 sugestao]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideias pequenas tambem movem produto. Manda o rascunho, a pergunta, a provocacao.
        Se ja estiver bem definida, talvez ela vire uma Feature ou Melhoria depois.

  - type: textarea
    id: idea
    attributes:
      label: Ideia
      description: Descreva a sugestao em poucas palavras.
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Nivel de maturidade
      options:
        - Rascunho
        - Quero discutir
        - Ja tenho uma proposta concreta

  - type: dropdown
    id: area
    attributes:
      label: Area relacionada
      options:
        - Produto
        - Design
        - Comunidades
        - Eventos
        - Convites / compartilhamento
        - Mobile
        - Web
        - Backend / Supabase
        - Documentacao
        - Outra

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: O que motivou a sugestao? Existe exemplo real, feedback de usuario ou produto parecido?

  - type: textarea
    id: tradeoffs
    attributes:
      label: Possiveis ganhos e custos
      description: O que a sugestao melhora e quais riscos ou complexidades ela pode trazer?

  - type: textarea
    id: relation-to-scope
    attributes:
      label: Relacao com o escopo do MVP
      description: A sugestao parece estar dentro do MVP, fora do MVP ou depende de uma decisao em aberto?
      placeholder: Ex. Pode tocar a questao Q4 sobre visibilidade publica de eventos de comunidade.
