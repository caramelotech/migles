name: "❓ Dúvida"
description: "Pergunte sobre produto, código, arquitetura, regra ou processo."
title: "[❓ duvida]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Pergunta boa economiza retrabalho. Se travou, ficou ambíguo ou parece decisão escondida, abre aqui.

  - type: dropdown
    id: topic
    attributes:
      label: Assunto
      options:
        - Produto / spec
        - Regra de negocio
        - Arquitetura
        - Banco de dados / RLS
        - Supabase
        - Next.js web
        - Mobile
        - Design / UX
        - Processo
        - Outro

  - type: textarea
    id: question
    attributes:
      label: Pergunta
      description: Qual e a duvida?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique de onde surgiu a duvida e o que ja foi verificado.

  - type: textarea
    id: references
    attributes:
      label: Referencias
      description: Links, arquivos, secoes do spec, PRs, issues ou trechos de codigo relacionados.
      placeholder: Ex. docs/spec-v1.md secao 10 Q3

  - type: dropdown
    id: urgency
    attributes:
      label: Urgencia
      options:
        - Bloqueia implementacao
        - Importante, mas nao bloqueia
        - Baixa

  - type: textarea
    id: expected-output
    attributes:
      label: Tipo de resposta esperada
      description: O que resolveria esta duvida?
      placeholder: Ex. Decisao de produto, explicacao tecnica, ponteiro para documentacao ou proposta de ADR.
